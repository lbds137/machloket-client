<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Machloket</title>
		<meta content="Bot Invite" property="og:title" />
		<meta name="description" content="Invite this bot to your server!" />
		<meta content="/brand/icon-512.png" property="og:image" />
		<meta content="#4b458c" name="theme-color" />
		<link href="/style.css" rel="stylesheet" />
		<link href="/themes.css" rel="stylesheet" id="lightcss" />
		<style>
			body.no-theme {
				background: #16191b;
			}
			@media (prefers-color-scheme: light) {
				body.no-theme {
					background: #9397bd;
				}
			}
		</style>
	</head>
	<body class="no-theme">
		<div>
			<div id="invitebody">
				<img id="inviteimg" class="pfp" />
				<!-- Filled by auth.ts: text here would show untranslated until it runs (and signed
				     out, the bot's details never load), and the button's label depends on whether an
				     account can add the bot. The permissions block stays hidden (no empty heading's
				     room) until there are permissions to list. -->
				<h1 id="invitename"></h1>
				<p id="invitedescription"></p>
				<div id="permissions" hidden><h1></h1></div>
				<button id="AcceptInvite" style="visibility: hidden"></button>
			</div>
		</div>
		<script type="module" src="/index.js"></script>
	</body>
</html>
